<style>
  [hidden] { display: none !important; }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
  .uf-skip {
    position: absolute; left: -9999px; top: 0; z-index: 100;
    padding: 0.75rem 1rem; background: #4f46e5; color: #fff;
    border-radius: 0 0 0.5rem 0; font-weight: 600;
  }
  .uf-skip:focus { left: 0; outline: 2px solid #fff; outline-offset: -4px; }
  /* Hide native search clear button inconsistencies but keep behaviour */
  input[type="search"]::-webkit-search-decoration { -webkit-appearance: none; }
  
/* Smooth page and tab transitions */
@keyframes uf-view-enter {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes uf-view-exit {
  from {
    opacity: 1;
    transform: translateY(0);
  }
  to {
    opacity: 0;
    transform: translateY(-6px);
  }
}

.uf-view-enter {
  animation: uf-view-enter 280ms ease-out both;
}

.uf-view-exit {
  animation: uf-view-exit 180ms ease-in both;
}

/* Confirmation modal */
@keyframes uf-modal-backdrop-in {
  from { opacity: 0; }
  to   { opacity: 1; }
}
@keyframes uf-modal-backdrop-out {
  from { opacity: 1; }
  to   { opacity: 0; }
}
@keyframes uf-modal-panel-in {
  from { opacity: 0; transform: translateY(12px) scale(0.96); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes uf-modal-panel-out {
  from { opacity: 1; transform: translateY(0) scale(1); }
  to   { opacity: 0; transform: translateY(8px) scale(0.97); }
}

.uf-modal-backdrop {
  animation: uf-modal-backdrop-in 200ms ease-out both;
}
.uf-modal-backdrop.uf-modal-closing {
  animation: uf-modal-backdrop-out 160ms ease-in both;
}
.uf-modal-panel {
  animation: uf-modal-panel-in 260ms cubic-bezier(0.16, 1, 0.3, 1) both;
}
.uf-modal-backdrop.uf-modal-closing .uf-modal-panel {
  animation: uf-modal-panel-out 160ms ease-in both;
}

</style>

<body class="min-h-screen bg-slate-50 font-sans text-slate-900 antialiased">
  <a href="#main" class="uf-skip">Skip to content</a>

  <header id="site-header" class="sticky top-0 z-40"></header>

  <main id="main" class="mx-auto w-full max-w-6xl scroll-mt-20 px-4 pb-16 sm:px-6 lg:px-8">
    <div id="view-home"></div>
    <div id="view-tool" hidden></div>

    <div id="view-recents" hidden></div>
  </main>

  <div id="toast-region" class="pointer-events-none fixed inset-x-0 bottom-5 z-50 flex flex-col items-center gap-2 px-4" aria-live="polite" aria-atomic="true"></div>

  <div id="modal-root"></div>

<script>
(function () {
  'use strict';

  /* ============================================================
     ICONS
     ============================================================ */
  const ICONS = {
    ruler: '<path d="M21.3 15.3a2.4 2.4 0 0 1 0 3.4l-2.6 2.6a2.4 2.4 0 0 1-3.4 0L2.7 8.7a2.41 2.41 0 0 1 0-3.4l2.6-2.6a2.41 2.41 0 0 1 3.4 0Z"/><path d="m14.5 12.5 2-2"/><path d="m11.5 9.5 2-2"/><path d="m8.5 6.5 2-2"/><path d="m17.5 15.5 2-2"/>',
    weight: '<circle cx="12" cy="5" r="3"/><path d="M6.5 8a2 2 0 0 0-1.905 1.46L2.1 18.5A2 2 0 0 0 4 21h16a2 2 0 0 0 1.925-2.54L19.4 9.5A2 2 0 0 0 17.5 8Z"/>',
    thermometer: '<path d="M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0Z"/>',
    grid: '<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/><path d="M9 3v18"/><path d="M15 3v18"/>',
    beaker: '<path d="M4.5 3h15"/><path d="M6 3v16a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V3"/><path d="M6 14h12"/>',
    gauge: '<path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/>',
    clock: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
    hardDrive: '<line x1="22" x2="2" y1="12" y2="12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/><line x1="6" x2="6.01" y1="16" y2="16"/><line x1="10" x2="10.01" y1="16" y2="16"/>',
    network: '<rect x="16" y="16" width="6" height="6" rx="1"/><rect x="2" y="16" width="6" height="6" rx="1"/><rect x="9" y="2" width="6" height="6" rx="1"/><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"/><path d="M12 12V8"/>',
    swap: '<path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/>',
    copy: '<rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',
    reset: '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>',
    arrowRight: '<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
    menu: '<line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/>',
    x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
    check: '<path d="M20 6 9 17l-5-5"/>',
    star: '<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>',
    search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
    sparkles: '<path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/>',
    zap: '<path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/>'
  };

  function icon(name, cls) {
    const classes = cls || 'h-5 w-5';
    return '<svg class="' + classes + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">' + (ICONS[name] || '') + '</svg>';
  }

  function starIcon(filled, cls) {
    const classes = cls || 'h-4 w-4';
    return '<svg class="' + classes + '" viewBox="0 0 24 24" fill="' + (filled ? 'currentColor' : 'none') + '" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">' + ICONS.star + '</svg>';
  }

  /* ============================================================
     SHARED CLASS STRINGS
     ============================================================ */
  const UI = {
    label: 'block text-xs font-semibold uppercase tracking-wider text-slate-500',
    input: 'block w-full rounded-xl border border-slate-300 bg-white px-3.5 py-2.5 text-base text-slate-900 shadow-sm transition placeholder:text-slate-400 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/30',
    inputSm: 'block w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 shadow-sm transition placeholder:text-slate-400 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/30',
    btnPrimary: 'inline-flex items-center justify-center gap-2 rounded-xl bg-brand-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-brand-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-500 focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50',
    btnSecondary: 'inline-flex items-center justify-center gap-2 rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm font-semibold text-slate-700 shadow-sm transition hover:border-slate-300 hover:bg-slate-50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-500 focus-visible:ring-offset-2',
    chip: 'inline-flex items-center gap-1.5 rounded-full border px-3 py-1.5 text-sm font-medium transition focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-500 focus-visible:ring-offset-2',
    chipOn: 'border-brand-600 bg-brand-600 text-white shadow-sm hover:bg-brand-700',
    chipOff: 'border-slate-200 bg-white text-slate-600 hover:border-slate-300 hover:text-slate-900'
  };

  const PILL_BASE = 'inline-flex items-center gap-2 rounded-xl border px-3.5 py-2 text-sm font-semibold shadow-sm transition focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-500 focus-visible:ring-offset-2';
  const PILL_ON = 'border-amber-300 bg-amber-50 text-amber-700 hover:bg-amber-100';
  const PILL_OFF = 'border-slate-200 bg-white text-slate-700 hover:border-slate-300 hover:bg-slate-50';
  const ICON_FAV_BASE = 'absolute right-3 top-3 z-10 flex h-8 w-8 items-center justify-center rounded-full border bg-white/95 shadow-sm transition focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-500 focus-visible:ring-offset-2';
  const ICON_FAV_ON = 'border-amber-200 text-amber-500 hover:bg-amber-50';
  const ICON_FAV_OFF = 'border-slate-200 text-slate-400 hover:border-amber-200 hover:text-amber-500';
  const VIEW_ALL_LINK = 'shrink-0 rounded-lg border border-slate-200 bg-white px-3 py-1.5 text-xs font-medium text-slate-600 transition hover:border-brand-200 hover:text-brand-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-500 focus-visible:ring-offset-2';

  /* ============================================================
     CONSTANTS
     ============================================================ */
  const STORAGE_KEYS = { recents: 'unitflow:recents:v1', favorites: 'unitflow:favorites:v1' };
  const MAX_RECENTS = 50;
  const HOME_RECENTS_LIMIT = 4;
  const CATEGORIES = ['All Tools', 'Everyday', 'Science', 'Measurements', 'Digital'];
  const NUMERIC_RE = /^[+-]?(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][+-]?\d+)?$/;

  /* ============================================================
     UTILITIES
     ============================================================ */
  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }

  function formatNumber(n) {
    if (typeof n !== 'number' || !Number.isFinite(n)) return '—';
    if (n === 0) return '0';
    const abs = Math.abs(n);
    if (abs >= 1e15 || abs < 1e-6) {
      let s = n.toExponential(8);
      s = s.replace(/(\.\d*?)0+e/, '$1e').replace(/\.e/, 'e');
      return s;
    }
    const rounded = Number(n.toPrecision(12));
    try {
      return new Intl.NumberFormat('en-US', { maximumSignificantDigits: 12 }).format(rounded);
    } catch (err) {
      return String(rounded);
    }
  }

  function formatPlain(n) {
    return formatNumber(n).replace(/,/g, '');
  }

  function timeAgo(ts) {
    const diff = Date.now() - ts;
    const seconds = Math.round(diff / 1000);
    if (seconds < 45) return 'just now';
    const minutes = Math.round(seconds / 60);
    if (minutes < 60) return minutes + ' min ago';
    const hours = Math.round(minutes / 60);
    if (hours < 24) return hours + ' hr ago';
    const days = Math.round(hours / 24);
    if (days < 7) return days + (days === 1 ? ' day ago' : ' days ago');
    try {
      return new Date(ts).toLocaleDateString();
    } catch (err) {
      return 'earlier';
    }
  }

  async function copyText(text) {
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return true;
      }
    } catch (err) { /* fall through to legacy path */ }
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.top = '-1000px';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    } catch (err) {
      return false;
    }
  }

  function showToast(message) {
    const region = document.getElementById('toast-region');
    if (!region) return;
    const el = document.createElement('div');
    el.className = 'pointer-events-auto flex max-w-[calc(100vw-2rem)] items-center gap-2 rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm font-medium text-slate-700 shadow-lg';
    el.innerHTML = '<span class="text-emerald-600">' + icon('check', 'h-4 w-4') + '</span><span class="truncate"></span>';
    const textEl = el.querySelector('span:last-child');
    if (textEl) textEl.textContent = message;
    region.appendChild(el);
    setTimeout(function () {
      el.style.transition = 'opacity 200ms ease, transform 200ms ease';
      el.style.opacity = '0';
      el.style.transform = 'translateY(6px)';
      setTimeout(function () { el.remove(); }, 220);
    }, 2000);
  }

  /* ============================================================
     CONFIRMATION MODAL
     ============================================================ */
  let activeModal = null;

  function closeModal() {
    if (!activeModal) return;
    const modal = activeModal;
    activeModal = null;

    modal.backdrop.classList.add('uf-modal-closing');
    modal.backdrop.setAttribute('aria-hidden', 'true');

    window.setTimeout(function () {
      if (modal.backdrop.parentNode) {
        modal.backdrop.parentNode.removeChild(modal.backdrop);
      }
      document.body.style.overflow = '';
      if (modal.previousFocus && typeof modal.previousFocus.focus === 'function') {
        modal.previousFocus.focus({ preventScroll: true });
      }
    }, 170);
  }

  function confirmModal(opts) {
    const options = opts || {};
    const root = document.getElementById('modal-root');
    if (!root) return;

    // Close any existing modal first
    if (activeModal) {
      if (activeModal.backdrop.parentNode) {
        activeModal.backdrop.parentNode.removeChild(activeModal.backdrop);
      }
      activeModal = null;
    }

    const title = options.title || 'Are you sure?';
    const message = options.message || '';
    const confirmLabel = options.confirmLabel || 'Confirm';
    const cancelLabel = options.cancelLabel || 'Cancel';
    const danger = options.danger !== false;

    const backdrop = document.createElement('div');
    backdrop.className = 'uf-modal-backdrop fixed inset-0 z-[60] flex items-center justify-center bg-slate-900/40 p-4 backdrop-blur-sm';
    backdrop.setAttribute('role', 'dialog');
    backdrop.setAttribute('aria-modal', 'true');
    backdrop.setAttribute('aria-labelledby', 'modal-title');
    backdrop.setAttribute('aria-describedby', 'modal-desc');

    backdrop.innerHTML =
      '<div class="uf-modal-panel w-full max-w-sm rounded-2xl border border-slate-200 bg-white p-5 shadow-2xl shadow-slate-900/20 sm:p-6">' +
        '<div class="flex items-start gap-3">' +
          '<span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full ' +
            (danger ? 'bg-rose-50 text-rose-600' : 'bg-brand-50 text-brand-600') + '">' +
            icon(danger ? 'reset' : 'check', 'h-5 w-5') +
          '</span>' +
          '<div class="min-w-0">' +
            '<h2 id="modal-title" class="text-base font-semibold text-slate-900">' + escapeHtml(title) + '</h2>' +
            '<p id="modal-desc" class="mt-1 text-sm leading-relaxed text-slate-600">' + escapeHtml(message) + '</p>' +
          '</div>' +
        '</div>' +
        '<div class="mt-5 flex flex-col-reverse gap-2 sm:flex-row sm:justify-end">' +
          '<button type="button" data-modal-cancel class="' + UI.btnSecondary + '">' + escapeHtml(cancelLabel) + '</button>' +
          '<button type="button" data-modal-confirm class="inline-flex items-center justify-center gap-2 rounded-xl px-4 py-2.5 text-sm font-semibold text-white shadow-sm transition focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 ' +
            (danger
              ? 'bg-rose-600 hover:bg-rose-700 focus-visible:ring-rose-500'
              : 'bg-brand-600 hover:bg-brand-700 focus-visible:ring-brand-500') + '">' +
            escapeHtml(confirmLabel) +
          '</button>' +
        '</div>' +
      '</div>';

    root.appendChild(backdrop);
    document.body.style.overflow = 'hidden';

    activeModal = {
      backdrop: backdrop,
      previousFocus: document.activeElement
    };

    const cancelBtn = backdrop.querySelector('[data-modal-cancel]');
    const confirmBtn = backdrop.querySelector('[data-modal-confirm]');

    function onCancel() {
      closeModal();
      if (typeof options.onCancel === 'function') options.onCancel();
    }

    function onConfirm() {
      closeModal();
      if (typeof options.onConfirm === 'function') options.onConfirm();
    }

    if (cancelBtn) cancelBtn.addEventListener('click', onCancel);
    if (confirmBtn) confirmBtn.addEventListener('click', onConfirm);

    // Click outside the panel closes the modal
    backdrop.addEventListener('click', function (event) {
      if (event.target === backdrop) onCancel();
    });

    // Focus trap-ish: focus the confirm button
    if (confirmBtn) confirmBtn.focus({ preventScroll: true });

    // Escape closes (handled globally below, but also bind here for safety)
    const keyHandler = function (event) {
      if (event.key === 'Escape') {
        event.preventDefault();
        onCancel();
      }
    };
    backdrop.addEventListener('keydown', keyHandler);
  }


  /* ============================================================
     STORAGE
     ============================================================ */
  function safeRead(key, fallback) {
    try {
      const raw = window.localStorage.getItem(key);
      if (!raw) return fallback;
      return JSON.parse(raw);
    } catch (err) {
      return fallback;
    }
  }

  function safeWrite(key, value) {
    try {
      window.localStorage.setItem(key, JSON.stringify(value));
      return true;
    } catch (err) {
      return false;
    }
  }

  function getRecents() {
    const raw = safeRead(STORAGE_KEYS.recents, []);
    if (!Array.isArray(raw)) return [];
    return raw.filter(function (record) {
      if (!record || typeof record !== 'object') return false;
      if (typeof record.id !== 'string') return false;
      if (typeof record.toolId !== 'string' || !TOOLS[record.toolId]) return false;
      const tool = TOOLS[record.toolId];
      if (!tool.units.some(function (u) { return u.id === record.from; })) return false;
      if (!tool.units.some(function (u) { return u.id === record.to; })) return false;
      if (!Number.isFinite(record.input) || !Number.isFinite(record.output)) return false;
      if (!Number.isFinite(record.ts)) return false;
      record.signature = record.signature || (record.toolId + '|' + record.from + '|' + record.to + '|' + record.input);
      return true;
    }).slice(0, MAX_RECENTS);
  }

  function saveRecents(list) {
    safeWrite(STORAGE_KEYS.recents, list);
  }

  function getFavorites() {
    const raw = safeRead(STORAGE_KEYS.favorites, []);
    if (!Array.isArray(raw)) return [];
    const seen = new Set();
    const result = [];
    raw.forEach(function (id) {
      if (typeof id === 'string' && TOOLS[id] && !seen.has(id)) {
        seen.add(id);
        result.push(id);
      }
    });
    return result;
  }

  function saveFavorites(list) {
    safeWrite(STORAGE_KEYS.favorites, list);
  }

  /* ============================================================
     CONVERSION ENGINE
     ============================================================ */
  function tempToKelvin(value, unitId) {
    if (unitId === 'c') return value + 273.15;
    if (unitId === 'f') return (value - 32) * 5 / 9 + 273.15;
    return value;
  }

  function tempFromKelvin(kelvin, unitId) {
    if (unitId === 'c') return kelvin - 273.15;
    if (unitId === 'f') return (kelvin - 273.15) * 9 / 5 + 32;
    return kelvin;
  }

  function computeConversion(tool, raw, fromId, toId) {
    const valueStr = String(raw == null ? '' : raw).trim();
    if (valueStr === '') return { ok: false, empty: true };
    if (!NUMERIC_RE.test(valueStr)) {
      return { ok: false, message: 'Enter a valid number, e.g. 12.5 or -3.' };
    }
    const num = Number(valueStr);
    if (!Number.isFinite(num)) {
      return { ok: false, message: 'That number is outside the supported range.' };
    }
    const fromUnit = tool.units.find(function (u) { return u.id === fromId; });
    const toUnit = tool.units.find(function (u) { return u.id === toId; });
    if (!fromUnit || !toUnit) {
      return { ok: false, message: 'Please choose valid units.' };
    }

    let result;

  /* ============================================================
     SMALL HELPERS
     ============================================================ */
  function defaultState(tool) {
    return { from: tool.defaultFrom, to: tool.defaultTo, value: String(tool.defaultValue == null ? '1' : tool.defaultValue) };
  }

  function unitSymbol(tool, id) {
    const unit = tool.units.find(function (u) { return u.id === id; });
    return unit ? unit.symbol : '';
  }

  function sampleConversion(tool) {
    const sample = tool.sample;
    if (!sample) return '';
    const result = computeConversion(tool, sample.value, sample.from, sample.to);
    if (!result.ok) return '';
    const fromUnit = tool.units.find(function (u) { return u.id === sample.from; });
    const toUnit = tool.units.find(function (u) { return u.id === sample.to; });
    if (!fromUnit || !toUnit) return '';
    return formatNumber(sample.value) + ' ' + fromUnit.symbol + ' = ' + formatNumber(result.value) + ' ' + toUnit.symbol;
  }

  function searchIndex(tool) {
    const parts = [tool.name, tool.shortName, tool.description, tool.categories.join(' ')];
    tool.units.forEach(function (u) { parts.push(u.name, u.symbol); });
    return parts.join(' ').toLowerCase();
  }

  function resolveToolState(tool, params) {
    let state = toolStates[tool.id];
    if (!state) state = defaultState(tool);
    if (params) {
      const from = params.get('from');
      const to = params.get('to');
      const value = params.get('v');
      if (from && tool.units.some(function (u) { return u.id === from; })) state.from = from;
      if (to && tool.units.some(function (u) { return u.id === to; })) state.to = to;
      if (value != null) {
        const trimmed = value.trim();
        if (trimmed && NUMERIC_RE.test(trimmed) && Number.isFinite(Number(trimmed))) {
          state.value = trimmed;
        }
      }
    }
    toolStates[tool.id] = state;
    return state;
  }

  /* ============================================================

     ============================================================ */
  function addRecent(record) {
    const list = getRecents();
    const signature = record.toolId + '|' + record.from + '|' + record.to + '|' + record.input;
    if (list.length && list[0].signature === signature) return;

    const item = {
      id: 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      toolId: record.toolId,
      from: record.from,
      to: record.to,
      input: record.input,
      output: record.output,
      ts: Date.now(),
      signature: signature
    };
    const next = [item].concat(list.filter(function (x) { return x.signature !== signature; })).slice(0, MAX_RECENTS);
    saveRecents(next);
    if (currentRoute.name === 'home') refreshRecentsUI();
    if (currentRoute.name === 'recents') refreshRecentsPage();
  }

  function scheduleRecentSave(record) {
    pendingRecent = record;
    if (recentTimer) clearTimeout(recentTimer);
    recentTimer = setTimeout(function () {
      recentTimer = null;
      if (pendingRecent) {
        addRecent(pendingRecent);
        pendingRecent = null;
      }
    }, 900);
  }

  function removeRecent(id) {
    const next = getRecents().filter(function (r) { return r.id !== id; });
    saveRecents(next);

    if (currentRoute.name === 'recents') {
      refreshRecentsPage();
    } else if (currentRoute.name === 'home') {
      refreshRecentsUI();
    }
    showToast('Conversion removed');
  }

  function clearRecents() {
    saveRecents([]);
    if (currentRoute.name === 'recents') {
      refreshRecentsPage();
    } else if (currentRoute.name === 'home') {
      refreshRecentsUI();
    }
    showToast('Recent conversions cleared');
  }

    const actionLabel = (on ? 'Remove ' : 'Add ') + tool.name + (on ? ' from' : ' to') + ' favorites';
    if (variant === 'pill') {
      return '<button type="button" data-fav-id="' + escapeHtml(tool.id) + '" data-fav-style="pill" aria-pressed="' + on + '" aria-label="' + escapeHtml(actionLabel) + '" class="' + PILL_BASE + ' ' + (on ? PILL_ON : PILL_OFF) + '">' +
        starIcon(on, 'h-4 w-4') + '<span>' + (on ? 'Saved' : 'Save') + '</span></button>';
    }
    return '<button type="button" data-fav-id="' + escapeHtml(tool.id) + '" aria-pressed="' + on + '" aria-label="' + escapeHtml(actionLabel) + '" class="' + ICON_FAV_BASE + ' ' + (on ? ICON_FAV_ON : ICON_FAV_OFF) + '">' +
      starIcon(on, 'h-4 w-4') + '</button>';
  }

  function updateFavButton(btn, on) {
    const id = btn.getAttribute('data-fav-id');
    const tool = TOOLS[id];
    const name = tool ? tool.name : 'converter';
    btn.setAttribute('aria-pressed', String(on));
    btn.setAttribute('aria-label', (on ? 'Remove ' : 'Add ') + name + (on ? ' from' : ' to') + ' favorites');

    if (btn.getAttribute('data-fav-style') === 'pill') {
      btn.className = PILL_BASE + ' ' + (on ? PILL_ON : PILL_OFF);
      btn.innerHTML = starIcon(on, 'h-4 w-4') + '<span>' + (on ? 'Saved' : 'Save') + '</span>';
    } else {
      btn.className = ICON_FAV_BASE + ' ' + (on ? ICON_FAV_ON : ICON_FAV_OFF);
      btn.innerHTML = starIcon(on, 'h-4 w-4');
    }
  }

  function applyFavoriteStates() {
    const favorites = getFavorites();
    document.querySelectorAll('[data-fav-id]').forEach(function (btn) {
      const id = btn.getAttribute('data-fav-id');
      updateFavButton(btn, favorites.indexOf(id) !== -1);
    });
  }

  function toggleFavorite(toolId) {
    if (!TOOLS[toolId]) return;
    const favorites = getFavorites();
    const index = favorites.indexOf(toolId);
    if (index === -1) {
      favorites.unshift(toolId);
      showToast('Added to favorites');
    } else {
      favorites.splice(index, 1);
      showToast('Removed from favorites');
    }
    saveFavorites(favorites);
    applyFavoriteStates();

    if (currentRoute.name === 'favorites') {
      renderFavoritesView();
    } else if (currentRoute.name === 'home') {
      refreshHomeFavorites();
    }
  }

  function showView(name) {

        el.classList.remove('uf-view-enter');

        // Restart the entrance animation
        void el.offsetWidth;

        el.classList.remove('uf-view-enter');

  function renderQuickUnits() {
    const toolSel = document.getElementById('quick-tool');
    const fromSel = document.getElementById('quick-from');
    const toSel = document.getElementById('quick-to');
    if (!toolSel || !fromSel || !toSel) return;

    const tool = TOOLS[quickState.toolId] || TOOLS.length;
    toolSel.value = tool.id;

    const opts = tool.units.map(function (u) {
      return '<option value="' + escapeHtml(u.id) + '">' + escapeHtml(u.name) + ' (' + escapeHtml(u.symbol) + ')</option>';
    }).join('');

    fromSel.innerHTML = opts;
    toSel.innerHTML = opts;

    fromSel.value = quickState.from;
    toSel.value = quickState.to;

    if (fromSel.value !== quickState.from) {
      quickState.from = tool.defaultFrom;
      fromSel.value = quickState.from;
    }
    if (toSel.value !== quickState.to) {
      quickState.to = tool.defaultTo;
      toSel.value = quickState.to;
    }
  }

  function updateQuick() {
    const tool = TOOLS[quickState.toolId];
    const resultEl = document.getElementById('quick-result');
    const unitEl = document.getElementById('quick-unit');
    const errEl = document.getElementById('quick-error');
    const openEl = document.getElementById('quick-open');
    if (!tool || !resultEl || !unitEl || !errEl) return;

    const fromUnit = tool.units.find(function (u) { return u.id === quickState.from; }) || tool.units[0];
    const toUnit = tool.units.find(function (u) { return u.id === quickState.to; }) || tool.units[0];

    const res = computeConversion(tool, quickState.value, fromUnit.id, toUnit.id);

    if (res.ok) {
      resultEl.textContent = formatNumber(res.value);
      unitEl.textContent = toUnit.symbol;
      errEl.textContent = '';
      errEl.hidden = true;
    } else {
      resultEl.textContent = '—';
      unitEl.textContent = '';
      errEl.textContent = res.message || '';
      errEl.hidden = !res.message;
    }

    if (openEl) {
      const v = (quickState.value && NUMERIC_RE.test(String(quickState.value).trim())) ? String(quickState.value).trim() : '1';
      openEl.setAttribute('href', '#/tool/' + tool.id +
        '?from=' + encodeURIComponent(fromUnit.id) +
        '&to=' + encodeURIComponent(toUnit.id) +
        '&v=' + encodeURIComponent(v));
    }
  }

  function bindQuickConvert() {
    const card = document.getElementById('quick-card');
    if (!card) return;

    renderQuickUnits();
    updateQuick();

    card.addEventListener('change', function (event) {
      const target = event.target;
      if (target.id === 'quick-tool') {
        const tool = TOOLS[target.value];
        if (!tool) return;
        quickState.toolId = tool.id;
        quickState.from = tool.defaultFrom;
        quickState.to = tool.defaultTo;
        renderQuickUnits();
        updateQuick();
      } else if (target.id === 'quick-from') {
        quickState.from = target.value;
        updateQuick();
      } else if (target.id === 'quick-to') {
        quickState.to = target.value;
        updateQuick();
      }
    });

    card.addEventListener('input', function (event) {
      if (event.target.id === 'quick-value') {
        quickState.value = event.target.value;
        updateQuick();
      }
    });
  }

  function applyHomeFilters() {
    const grid = document.getElementById('tool-grid');
    if (!grid) return;

    const searchEl = document.getElementById('tool-search');
    const q = (searchEl && searchEl.value ? searchEl.value : '').trim().toLowerCase();
    const activeChip = document.querySelector('#category-filters [data-cat][aria-pressed="true"]');
    const cat = activeChip ? activeChip.getAttribute('data-cat') : 'All Tools';

    const cards = grid.querySelectorAll('[data-categories]');
    let shown = 0;

    cards.forEach(function (card) {
      const cats = (card.getAttribute('data-categories') || '').split(',');
      const hay = card.getAttribute('data-search') || '';
      const catOk = cat === 'All Tools' || cats.indexOf(cat) !== -1;
      const queryOk = !q || hay.indexOf(q) !== -1;
      const ok = catOk && queryOk;
      card.hidden = !ok;
      if (ok) shown += 1;
    });

    const empty = document.getElementById('tools-empty');
    if (empty) empty.hidden = shown > 0;

    const count = document.getElementById('tools-count');
    if (count) {
      count.textContent = shown === cards.length
        ? cards.length + ' converters'
        : 'Showing ' + shown + ' of ' + cards.length;
    }
  }

  function setActiveCategory(cat) {
    const filters = document.getElementById('category-filters');
    if (!filters) return;
    filters.querySelectorAll('[data-cat]').forEach(function (btn) {
      const on = btn.getAttribute('data-cat') === cat;
      btn.className = UI.chip + ' ' + (on ? UI.chipOn : UI.chipOff);
      btn.setAttribute('aria-pressed', String(on));
    });
  }

  function bindHomeEvents() {
    const filters = document.getElementById('category-filters');
    if (filters) {
      filters.addEventListener('click', function (event) {
        const btn = event.target.closest('[data-cat]');
        if (!btn) return;
        setActiveCategory(btn.getAttribute('data-cat'));
        history.replaceState(null, '', '#/?cat=' + encodeURIComponent(btn.getAttribute('data-cat')));
        applyHomeFilters();
      });
    }

    const searchEl = document.getElementById('tool-search');
    if (searchEl) {
      searchEl.addEventListener('input', applyHomeFilters);
      searchEl.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') {
          searchEl.value = '';
          applyHomeFilters();
        }
      });
    }

    const clearFilters = document.getElementById('clear-filters');
    if (clearFilters) {
      clearFilters.addEventListener('click', function () {
        const el = document.getElementById('tool-search');
        if (el) el.value = '';
        setActiveCategory('All Tools');
        history.replaceState(null, '', '#/');
        applyHomeFilters();
      });
    }
  }

  function bindToolEvents(tool, state) {
    const input = document.getElementById('input-value');
    const fromSel = document.getElementById('unit-from');
    const toSel = document.getElementById('unit-to');
    const signBtn = document.getElementById('sign-btn');
    const swapBtn = document.getElementById('swap-btn');
    const copyBtn = document.getElementById('copy-btn');
    const resetBtn = document.getElementById('reset-btn');

    if (!input || !fromSel || !toSel || !signBtn || !swapBtn || !copyBtn || !resetBtn) return;

    input.value = state.value;
    fromSel.value = state.from;
    toSel.value = state.to;

    input.addEventListener('input', function () {
      toolStates[tool.id].value = input.value;
      updateCalculator(tool, { save: true });
    });

    fromSel.addEventListener('change', function () {
      toolStates[tool.id].from = fromSel.value;
      updateCalculator(tool, { save: true });
    });

    toSel.addEventListener('change', function () {
      toolStates[tool.id].to = toSel.value;
      updateCalculator(tool, { save: true });
    });

    swapBtn.addEventListener('click', function () {
      swapBtn.classList.toggle('rotate-180');

      const previousFrom = fromSel.value;
      fromSel.value = toSel.value;
      toSel.value = previousFrom;

      toolStates[tool.id].from = fromSel.value;
      toolStates[tool.id].to = toSel.value;

      updateCalculator(tool, { save: true });
      showToast('Swapped: ' + unitSymbol(tool, fromSel.value) + ' → ' + unitSymbol(tool, toSel.value));
    });

    signBtn.addEventListener('click', function () {
      const value = input.value.trim();
      if (!value) return;
      if (value.charAt(0) === '-') {
        input.value = value.slice(1);
      } else if (NUMERIC_RE.test(value)) {
        input.value = '-' + value;
      } else {
        return;
      }
      toolStates[tool.id].value = input.value;
      updateCalculator(tool, { save: true });
      input.focus();
    });

    copyBtn.addEventListener('click', async function () {
      if (!currentCopy) return;
      const success = await copyText(currentCopy);
      showToast(success ? 'Result copied to clipboard' : 'Copy failed — please copy manually');
    });

    resetBtn.addEventListener('click', function () {
      const defaults = defaultState(tool);
      input.value = defaults.value;
      fromSel.value = defaults.from;
      toSel.value = defaults.to;
      toolStates[tool.id] = defaults;
      updateCalculator(tool, { save: false });
      input.focus();
      showToast('Calculator reset');
    });

    viewTool.querySelectorAll('[data-preset-from]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        const from = btn.getAttribute('data-preset-from');
        const to = btn.getAttribute('data-preset-to');
        if (!from || !to) return;
        fromSel.value = from;
        toSel.value = to;
        toolStates[tool.id].from = from;
        toolStates[tool.id].to = to;
        updateCalculator(tool, { save: true });
        const calculator = document.getElementById('calculator');
        if (calculator) calculator.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    });

    updateCalculator(tool, { save: false });
  }

  function updateCalculator(tool, opts) {
    const options = opts || {};
    const input = document.getElementById('input-value');
    const fromSel = document.getElementById('unit-from');
    const toSel = document.getElementById('unit-to');
    if (!input || !fromSel || !toSel) return;

    const fromUnit = tool.units.find(function (u) { return u.id === fromSel.value; });
    const toUnit = tool.units.find(function (u) { return u.id === toSel.value; });
    if (!fromUnit || !toUnit) return;

    const numberEl = document.getElementById('result-number');
    const unitEl = document.getElementById('result-unit');
    const equationEl = document.getElementById('result-equation');
    const errorEl = document.getElementById('conversion-error');
    const copyBtn = document.getElementById('copy-btn');
    if (!numberEl || !unitEl || !equationEl || !errorEl) return;

    const result = computeConversion(tool, input.value, fromUnit.id, toUnit.id);

    if (!result.ok) {
      numberEl.textContent = '—';
      unitEl.textContent = '';
      errorEl.textContent = result.message || '';
      errorEl.hidden = !result.message;
      input.setAttribute('aria-invalid', result.message ? 'true' : 'false');
      equationEl.textContent = result.empty ? 'Enter a value to convert.' : '';
      currentCopy = null;
      if (copyBtn) copyBtn.disabled = true;
      if (recentTimer) { clearTimeout(recentTimer); recentTimer = null; pendingRecent = null; }
    } else {
      const formatted = formatNumber(result.value);
      numberEl.textContent = formatted;
      unitEl.textContent = toUnit.symbol;
      errorEl.textContent = '';
      errorEl.hidden = true;
      input.setAttribute('aria-invalid', 'false');
      equationEl.textContent = formatNumber(result.input) + ' ' + fromUnit.symbol + ' = ' + formatted + ' ' + toUnit.symbol;
      currentCopy = formatPlain(result.value) + ' ' + toUnit.symbol;
      if (copyBtn) copyBtn.disabled = false;
      if (options.save) {
        scheduleRecentSave({
          toolId: tool.id,
          from: fromUnit.id,
          to: toUnit.id,
          input: result.input,
          output: result.value
        });
      }
    }

    updateReferenceTable(tool, fromUnit.id);
  }

  function updateReferenceTable(tool, fromId) {
    const tbody = document.getElementById('ref-tbody');
    const caption = document.getElementById('ref-caption');
    if (!tbody) return;
    const fromUnit = tool.units.find(function (u) { return u.id === fromId; });
    if (!fromUnit) return;

    if (caption) caption.textContent = '1 ' + fromUnit.symbol + ' converted to other units';

    tbody.innerHTML = tool.units.map(function (unit) {
      let value = '—';
      if (unit.id === fromId) {
        value = '1';
      } else {
        const result = computeConversion(tool, 1, fromId, unit.id);
        if (result.ok) value = formatNumber(result.value);
      }
      return '<tr class="border-t border-slate-100' + (unit.id === fromId ? ' bg-brand-50/40' : '') + '">' +
        '<th scope="row" class="whitespace-nowrap px-4 py-2.5 text-left font-medium text-slate-700">' + escapeHtml(unit.name) + '</th>' +
        '<td class="whitespace-nowrap px-4 py-2.5 text-slate-500">' + escapeHtml(unit.symbol) + '</td>' +
        '<td class="whitespace-nowrap px-4 py-2.5 text-left text-slate-700 tabular-nums">' + value + '</td>' +
      '</tr>';
    }).join('');
  }

  /* ============================================================
     ROUTING
     ============================================================ */
  function parseRoute() {
    const hash = window.location.hash || '';
    const raw = hash.charAt(0) === '#' ? hash.slice(1) : hash;
    const parts = raw.split('?');
    const pathRaw = parts[0] || '';
    const queryRaw = parts[1] || '';
    const path = pathRaw.replace(/^\/+/, '').replace(/\/+$/, '');
    const segments = path ? path.split('/') : [];
    const params = new URLSearchParams(queryRaw);

    if (segments[0] === 'tool' && segments[1]) {
      return { name: 'tool', toolId: segments[1], params: params };
    }
    if (segments[0] === 'favorites') {
      return { name: 'favorites', params: params };
    }
    if (segments[0] === 'recents') {
      return { name: 'recents', params: params };
    }
    return { name: 'home', params: params };
  }

  function navigateHomeAndScroll() {
    if (currentRoute.name === 'home') {
      const tools = document.getElementById('tools');
      if (tools) tools.scrollIntoView({ behavior: 'smooth', block: 'start' });
      return;
    }
    pendingScroll = 'tools';
    if (window.location.hash === '#/' || window.location.hash === '#' || window.location.hash === '') {
      handleRoute();
    } else {
      window.location.hash = '#/';
    }
  }

  function handleRoute() {
    const route = parseRoute();
    currentRoute = route;

    renderHeader(route);

    if (route.name === 'tool') {
      renderToolView(route.toolId, route.params);
    } else if (route.name === 'favorites') {
      renderFavoritesView();
    } else if (route.name === 'recents') {
      renderRecentsView();
    } else {
      renderHomeView(route.params);
    }

    if (route.name === 'tool' && TOOLS[route.toolId]) {
      document.title = TOOLS[route.toolId].name + ' · UnitFlow';
    } else if (route.name === 'favorites') {
      document.title = 'Favorites · UnitFlow';
    } else if (route.name === 'recents') {
      document.title = 'Recent conversions · UnitFlow';
    } else {
      document.title = 'UnitFlow — Every conversion. One simple place.';
    }

    if (pendingScroll) {
      const target = document.getElementById(pendingScroll);
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      pendingScroll = null;
    } else if (!firstRender) {
      window.scrollTo(0, 0);
    }

    if (!firstRender) {
      const activeView = route.name === 'tool' ? viewTool
        : route.name === 'favorites' ? viewFavorites
        : route.name === 'recents' ? viewRecents
        : viewHome;
      const heading = activeView.querySelector('h1');
      if (heading) heading.focus({ preventScroll: true });
    }

    firstRender = false;
  }


  /* ============================================================
     GLOBAL EVENT DELEGATION
     ============================================================ */

  // Single helper so open/close logic never drifts from renderHeader()
function closeMobileMenu(menu, toggle) {
  if (!menu) return;

  menu.classList.remove(
    'max-h-96',
    'opacity-100',
    'translate-y-0'
  );

  menu.classList.add(
    'max-h-0',
    'opacity-0',
    '-translate-y-2'
  );

  menu.setAttribute('aria-hidden', 'true');
  menu.setAttribute('inert', '');

  if (toggle) {
    toggle.setAttribute('aria-expanded', 'false');
    toggle.setAttribute('aria-label', 'Open navigation menu');

    toggle.innerHTML =
      '<span class="sr-only">Toggle navigation menu</span>' +
      icon('menu', 'h-5 w-5');
  }
}

  document.addEventListener('click', function (event) {
    // Mobile hamburger menu toggle
const menuToggle = event.target.closest('#menu-toggle');

if (menuToggle) {
  event.preventDefault();

  const menu = document.getElementById('mobile-menu');

  if (!menu) return;

  const isOpen =
    menuToggle.getAttribute('aria-expanded') === 'true';

  if (isOpen) {
    closeMobileMenu(menu, menuToggle);
  } else {
    menu.classList.remove(
      'max-h-0',
      'opacity-0',
      '-translate-y-2'
    );

    menu.classList.add(
      'max-h-96',
      'opacity-100',
      'translate-y-0'
    );

    menu.setAttribute('aria-hidden', 'false');
    menu.removeAttribute('inert');

    menuToggle.setAttribute('aria-expanded', 'true');
    menuToggle.setAttribute('aria-label', 'Close navigation menu');

    menuToggle.innerHTML =
      '<span class="sr-only">Toggle navigation menu</span>' +
      icon('x', 'h-5 w-5');
  }

  return;
}
const scrollTrigger = event.target.closest('[data-scroll="tools"]');

if (scrollTrigger) {
  event.preventDefault();

  const menu = document.getElementById('mobile-menu');
  const toggle = document.getElementById('menu-toggle');

  if (menu && toggle) {
    closeMobileMenu(menu, toggle);
  }

  navigateHomeAndScroll();
  return;
}

    const favoriteBtn = event.target.closest('[data-fav-id]');
    if (favoriteBtn) {
      event.preventDefault();
      toggleFavorite(favoriteBtn.getAttribute('data-fav-id'));
      return;
    }

    const removeBtn = event.target.closest('[data-remove-recent]');
    if (removeBtn) {
      event.preventDefault();
      removeRecent(removeBtn.getAttribute('data-remove-recent'));
      return;
    }

    // Close the mobile menu when a click lands outside both menu and toggle.
    const menu = document.getElementById('mobile-menu');
    const toggle = document.getElementById('menu-toggle');
    if (menu && toggle && toggle.getAttribute('aria-expanded') === 'true') {
      if (!menu.contains(event.target) && !toggle.contains(event.target)) {
        closeMobileMenu(menu, toggle);
      }
    }

    const link = event.target.closest('a[href^="#/"]');
    if (link && !link.hasAttribute('data-scroll')) {
      const href = link.getAttribute('href');
      if (href === window.location.hash) {
        event.preventDefault();
        handleRoute();
      }
    }
  });

  document.addEventListener('keydown', function (event) {
    if (event.key !== 'Escape') return;

    // If a confirmation modal is open, it takes priority
    if (activeModal) {
      event.preventDefault();
      closeModal();
      return;
    }

    const menu = document.getElementById('mobile-menu');
    const toggle = document.getElementById('menu-toggle');
    if (menu && toggle && toggle.getAttribute('aria-expanded') === 'true') {
      closeMobileMenu(menu, toggle);
      toggle.focus();
    }
  });

  window.addEventListener('hashchange', handleRoute);

  /* ============================================================
     INIT
     ============================================================ */
  renderFooter();
  handleRoute();
})();
</script>
